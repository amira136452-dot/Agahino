<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087d48"><title>پنل پشتیبانی آگهینو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#182230;font:14px Tahoma,Arial;line-height:1.9}.wrap{max-width:1050px;margin:auto;padding:16px}.panel,header{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin-bottom:12px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 14px;background:#087d48;color:white;cursor:pointer}.btn.alt{background:#eef7f1;color:#087d48}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:320px 1fr;gap:12px}.ticket{border-bottom:1px solid #eee;padding:12px;cursor:pointer}.ticket.active{background:#eef7f1}.muted{color:#667085;font-size:12px}.tag{background:#eef2f6;border-radius:20px;padding:2px 8px;font-size:11px}.messages{height:48vh;overflow:auto;background:#f8faf9;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:85%;padding:10px;border-radius:11px;background:white;border:1px solid #e4e7ec;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.staff{background:#e8f5ee;align-self:flex-end}.field{margin:10px 0}.field textarea,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.empty{text-align:center;padding:25px;color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr}.messages{height:40vh}}
</style></head><body><div class="wrap">
<header class="head"><div><b style="font-size:20px">پنل پشتیبانی آگهینو</b><div class="muted">فقط حساب دارای نقش امن admin به این بخش دسترسی دارد.</div></div><div><a class="btn alt" href="./index.html" style="text-decoration:none">صفحه اصلی</a> <button class="btn alt" id="logout">خروج</button></div></header>
<div id="notice" class="panel">در حال بررسی دسترسی…</div>
<div id="app" class="grid" style="display:none"><section class="panel"><div class="row"><b>درخواست‌ها</b><button class="btn alt" id="refresh">به‌روزرسانی</button></div><div id="tickets" style="margin-top:8px"></div></section>
<section class="panel"><div id="title"><b>یک درخواست را انتخاب کنید</b></div><div class="row" id="statusRow" style="display:none;margin:10px 0"><label for="status">وضعیت درخواست</label><select id="status" style="padding:8px;border:1px solid #d0d5dd;border-radius:8px"><option value="open">ثبت شده</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده شده</option><option value="closed">بسته شده</option></select><button class="btn" id="saveStatus">ذخیره وضعیت</button></div><div class="messages" id="messages"><div class="empty">برای مشاهده مکالمه، یک درخواست را انتخاب کنید.</div></div><form id="replyForm" style="display:none"><div class="field"><textarea id="reply" rows="3" maxlength="3000" required placeholder="پاسخ پشتیبانی…"></textarea></div><button class="btn" type="submit">ارسال پاسخ</button></form></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://zfenskabbrhssqxxcasw.supabase.co','sb_publishable_4vcGwG6QhV5gTaJWyIwckQ_N2nK6Kq');const $=id=>document.getElementById(id);let me=null,active=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={open:'ثبت شده',in_progress:'در حال بررسی',answered:'پاسخ داده شده',closed:'بسته شده'};
function notice(s){$('notice').textContent=s}
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user;if(!me){notice('ابتدا با حساب کاربری پشتیبان وارد شوید.');return}const role=me.app_metadata?.role;if(role!=='admin'){notice('این حساب نقش admin ندارد؛ دسترسی رد شد. برای امنیت، نقش از اطلاعات امن سرور خوانده می‌شود.');return}$('notice').style.display='none';$('app').style.display='grid';await loadTickets()}
async function loadTickets(){const {data,error}=await db.from('support_tickets').select('id,user_id,subject,status,created_at,updated_at').order('updated_at',{ascending:false});if(error){$('tickets').textContent='خطا: '+error.message;return}if(!data?.length){$('tickets').innerHTML='<div class="empty">درخواستی ثبت نشده است.</div>';return}$('tickets').innerHTML=data.map(t=>'<div class="ticket '+(active===t.id?'active':'')+'" onclick="openTicket(\''+t.id+'\')"><b>'+esc(t.subject)+'</b><div class="muted">'+(labels[t.status]||t.status)+' · '+new Date(t.created_at).toLocaleString('fa-IR')+'</div><div class="muted">شناسه کاربر: '+esc(t.user_id)+'</div></div>').join('')}
async function openTicket(id){const {data:t,error}=await db.from('support_tickets').select('id,subject,status,user_id').eq('id',id).single();if(error||!t){alert('دریافت درخواست انجام نشد: '+(error?.message||''));return}active=id;$('title').innerHTML='<b>'+esc(t.subject)+'</b><div class="muted">شناسه کاربر: '+esc(t.user_id)+'</div>';$('status').value=t.status;$('statusRow').style.display='flex';$('replyForm').style.display=t.status==='closed'?'none':'block';const {data,error:me}=await db.from('support_messages').select('id,sender_id,body,created_at').eq('ticket_id',id).order('created_at',{ascending:true});if(error){$('messages').textContent='خطا در دریافت پیام‌ها: '+error.message;return}$('messages').innerHTML=data?.length?data.map(m=>'<div class="bubble '+(m.sender_id===t.user_id?'':'staff')+'">'+esc(m.body)+'<div class="muted">'+(m.sender_id===t.user_id?'کاربر':'پشتیبانی')+' · '+new Date(m.created_at).toLocaleString('fa-IR')+'</div></div>').join(''):'<div class="empty">بدون پیام</div>';$('messages').scrollTop=$('messages').scrollHeight;await loadTickets()}
$('refresh').onclick=loadTickets;
$('saveStatus').onclick=async()=>{if(!active)return;const {error}=await db.from('support_tickets').update({status:$('status').value,updated_at:new Date().toISOString()}).eq('id',active);if(error){alert('ذخیره وضعیت انجام نشد: '+error.message);return}await openTicket(active)};
$('replyForm').onsubmit=async e=>{e.preventDefault();if(!active||!me)return;const b=e.submitter;b.disabled=true;const {error}=await db.from('support_messages').insert({ticket_id:active,sender_id:me.id,body:$('reply').value.trim()});b.disabled=false;if(error){alert('ارسال پاسخ انجام نشد: '+error.message);return}await db.from('support_tickets').update({status:'answered',updated_at:new Date().toISOString()}).eq('id',active);$('reply').value='';await openTicket(active)};
$('logout').onclick=async()=>{await db.auth.signOut();location.href='./index.html'};
db.auth.onAuthStateChange(()=>{if(!me)init()});init();
</script></body></html>
