<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087d48"><title>پشتیبانی آگهینو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#182230;font:14px Tahoma,Arial;line-height:1.9}.wrap{max-width:900px;margin:auto;padding:16px}.panel,header{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:16px;margin-bottom:13px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;background:#087d48;color:white;cursor:pointer;text-decoration:none}.btn.secondary{background:#eef7f1;color:#087d48}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.field textarea{min-height:100px;resize:vertical}.muted{color:#667085;font-size:12px}.ticket{padding:13px;border:1px solid #e4e7ec;border-radius:11px;margin:9px 0;cursor:pointer;background:#fff}.ticket.active{border-color:#087d48;background:#f0f8f3}.tag{display:inline-block;background:#eef2f6;border-radius:20px;padding:2px 9px;font-size:11px}.messages{min-height:180px;max-height:48vh;overflow:auto;background:#f8faf9;padding:12px;border-radius:11px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:85%;padding:10px 12px;border-radius:12px;background:white;border:1px solid #e4e7ec;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{background:#e8f5ee;align-self:flex-end}.empty{text-align:center;color:#667085;padding:25px}@media(max-width:600px){.wrap{padding:10px}.panel,header{padding:12px}}
</style></head><body><div class="wrap">
<header class="head"><div><b style="font-size:20px">پشتیبانی آگهینو</b><div class="muted">درخواست خود را ثبت کنید و پاسخ‌ها را همین‌جا پیگیری کنید.</div></div><a class="btn secondary" href="./index.html">بازگشت به آگهی‌ها</a></header>
<div id="notice" class="panel">در حال بررسی ورود…</div>
<div id="app" style="display:none">
<section class="panel"><h3 style="margin-top:0">ثبت درخواست جدید</h3><form id="newTicket"><div class="field"><label for="subject">موضوع درخواست</label><input id="subject" maxlength="140" minlength="3" required placeholder="مثلاً مشکل در ثبت آگهی"></div><div class="field"><label>پیوست اختیاری (عکس یا PDF، حداکثر ۱۰ مگابایت)</label><input id="firstFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><div class="field"><label for="firstMessage">شرح درخواست</label><textarea id="firstMessage" maxlength="3000" required placeholder="مشکل یا سؤال خود را توضیح دهید…"></textarea></div><button class="btn" type="submit">ثبت درخواست</button></form></section>
<div class="panel"><h3 style="margin-top:0">درخواست‌های من</h3><div id="tickets"><div class="empty">در حال دریافت…</div></div></div>
<section class="panel" id="threadPanel"><div id="threadTitle"><b>یک درخواست را انتخاب کنید</b></div><div id="thread" class="messages" style="margin:12px 0"><div class="empty">پاسخ‌ها و پیام‌های این درخواست اینجا نمایش داده می‌شوند.</div></div><form id="replyForm" style="display:none"><div class="field"><label>پیوست اختیاری (عکس یا PDF، حداکثر ۱۰ مگابایت)</label><input id="replyFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div><div class="field"><label for="reply">پیام شما</label><textarea id="reply" maxlength="3000" required placeholder="پاسخ یا توضیح تکمیلی…"></textarea></div><button class="btn" type="submit">ارسال پیام</button></form></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://zfenskabbrhssqxxcasw.supabase.co','sb_publishable_4vcGwG6QhV5gTaJWyIwckQ_NQ2nK6Kq');
const $=id=>document.getElementById(id);let me=null,activeTicket=null;
const allowed=['image/jpeg','image/png','image/webp','application/pdf'];
async function uploadFile(ticketId,file){if(!file)return null;if(!allowed.includes(file.type)||file.size>10485760)throw new Error('نوع فایل مجاز نیست یا حجم آن بیشتر از ۱۰ مگابایت است.');const ext=file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');const path=me.id+'/'+ticketId+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('support-attachments').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return path}
async function fileLink(path){const {data,error}=await db.storage.from('support-attachments').createSignedUrl(path,120);if(error){alert('دریافت فایل انجام نشد: '+error.message);return}window.open(data.signedUrl,'_blank','noopener')}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusLabel={open:'ثبت شده',in_progress:'در حال بررسی',answered:'پاسخ داده شده',closed:'بسته شده'};
function note(s){$('notice').textContent=s}
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user;if(!me){note('برای استفاده از پشتیبانی ابتدا وارد حساب آگهینو شوید.');return}$('notice').style.display='none';$('app').style.display='block';await loadTickets()}
async function loadTickets(){const {data,error}=await db.from('support_tickets').select('id,subject,status,created_at,updated_at').order('created_at',{ascending:false});if(error){$('tickets').textContent='دریافت درخواست‌ها انجام نشد: '+error.message;return}if(!data?.length){$('tickets').innerHTML='<div class="empty">هنوز درخواستی ثبت نکرده‌اید.</div>';return}$('tickets').innerHTML=data.map(t=>'<div class="ticket '+(activeTicket===t.id?'active':'')+'" onclick="openTicket(\''+t.id+'\')"><b>'+esc(t.subject)+'</b><div class="muted"><span class="tag">'+(statusLabel[t.status]||'در انتظار بررسی')+'</span> · '+new Date(t.created_at).toLocaleString('fa-IR')+'</div></div>').join('')}
async function openTicket(id){const {data:t,error}=await db.from('support_tickets').select('id,subject,status').eq('id',id).single();if(error||!t){alert('درخواست پیدا نشد یا دسترسی ندارید.');return}activeTicket=id;$('threadTitle').innerHTML='<b>'+esc(t.subject)+'</b><div class="muted">وضعیت: '+(statusLabel[t.status]||'نامشخص')+'</div>';$('replyForm').style.display=t.status==='closed'?'none':'block';const {data,error:msgError}=await db.from('support_messages').select('id,sender_id,body,attachment_path,created_at').eq('ticket_id',id).order('created_at',{ascending:true});if(msgError){$('thread').textContent='دریافت پیام‌ها انجام نشد: '+msgError.message;return}$('thread').innerHTML=msg?.length?msg.map(m=>'<div class="bubble '+(m.sender_id===me.id?'mine':'')+'">'+esc(m.body)+'<div class="muted">'+(m.sender_id===me.id?'شما':'پشتیبانی آگهینو')+' · '+new Date(m.created_at).toLocaleString('fa-IR')+'</div></div>').join(''):'<div class="empty">هنوز پیامی ثبت نشده است.</div>';$('thread').scrollTop=$('thread').scrollHeight;await loadTickets()}
$('newTicket').addEventListener('submit',async e=>{e.preventDefault();if(!me)return;const btn=e.submitter;btn.disabled=true;const {data:t,error}=await db.from('support_tickets').insert({user_id:me.id,subject:$('subject').value.trim()}).select('id').single();if(error){btn.disabled=false;alert('ثبت درخواست انجام نشد: '+error.message);return}let attachment=null;try{attachment=await uploadFile(t.id,$('firstFile').files[0]);}catch(err){btn.disabled=false;alert('بارگذاری فایل انجام نشد: '+err.message);return}const {error:msgError}=await db.from('support_messages').insert({ticket_id:t.id,sender_id:me.id,body:$('firstMessage').value.trim(),attachment_path:attachment});btn.disabled=false;if(msgError){alert('درخواست ایجاد شد اما پیام اولیه ثبت نشد. از بخش درخواست‌ها آن را باز کنید و دوباره پیام بفرستید.');await loadTickets();return}$('newTicket').reset();await loadTickets();await openTicket(t.id)});
$('replyForm').addEventListener('submit',async e=>{e.preventDefault();if(!activeTicket||!me)return;const btn=e.submitter;btn.disabled=true;let attachment=null;try{attachment=await uploadFile(activeTicket,$('replyFile').files[0]);}catch(err){btn.disabled=false;alert('بارگذاری فایل انجام نشد: '+err.message);return}const {error}=await db.from('support_messages').insert({ticket_id:activeTicket,sender_id:me.id,body:$('reply').value.trim(),attachment_path:attachment});btn.disabled=false;if(error){alert('ارسال پیام انجام نشد: '+error.message);return}$('reply').value='';await openTicket(activeTicket)});
db.auth.onAuthStateChange(()=>{if(!me)init()});init();
</script></body></html>
