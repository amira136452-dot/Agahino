<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087d48"><title>پیام‌های آگهینو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#182230;font:14px Tahoma,Arial;line-height:1.8}.wrap{max-width:1000px;margin:auto;padding:16px}header,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:9px;padding:9px 14px;background:#087d48;color:#fff;cursor:pointer;text-decoration:none}.btn.secondary{background:#eef7f1;color:#087d48}.layout{display:grid;grid-template-columns:300px 1fr;gap:12px}.list{max-height:70vh;overflow:auto}.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.item.active{background:#eef7f1}.muted{color:#667085;font-size:12px}.messages{height:55vh;overflow:auto;padding:12px;background:#f8faf9;border-radius:10px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:9px 12px;border-radius:12px;background:white;border:1px solid #e4e7ec;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#e8f5ee;align-self:flex-end}.send{display:flex;gap:8px;margin-top:10px}.send textarea{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:10px;padding:10px;resize:vertical}.empty{text-align:center;color:#667085;padding:28px}@media(max-width:700px){.layout{grid-template-columns:1fr}.list{max-height:28vh}.messages{height:48vh}}
</style></head><body><div class="wrap">
<header class="head"><div><b style="font-size:20px">💬 پیام‌های آگهینو</b><div class="muted">گفت‌وگوی مستقیم خریدار و فروشنده</div></div><a class="btn secondary" href="./index.html">بازگشت به آگهی‌ها</a></header>
<div id="notice" class="panel">در حال بررسی ورود…</div>
<div id="app" class="layout" style="display:none"><section class="panel list"><b>گفت‌وگوها</b><div id="threads" class="muted" style="margin-top:8px">در حال دریافت…</div></section>
<section class="panel"><div id="chatTitle"><b>یک گفت‌وگو را انتخاب کنید</b></div><div id="chat" class="messages"><div class="empty">برای شروع، از صفحه یک آگهی گزینه «سؤال از فروشنده» را بزنید.</div></div>
<form id="sendForm" class="send"><textarea id="body" rows="2" maxlength="3000" placeholder="پیام خود را بنویسید…" required></textarea><button class="btn" type="submit">ارسال</button></form></section></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://zfenskabbrhssqxxcasw.supabase.co','sb_publishable_4vcGwG6QhV5gTaJWyIwckQ_NQ2nK6Kq');
let me=null,active=null,channel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t){$('notice').textContent=t}
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user;if(!me){note('برای دیدن پیام‌ها ابتدا وارد حساب آگهینو شوید.');return} $('notice').style.display='none';$('app').style.display='grid';await loadThreads();const id=new URLSearchParams(location.search).get('conversation');if(id)await openThread(id)}
async function loadThreads(){const {data,error}=await db.from('ad_conversations').select('id,ad_id,buyer_id,seller_id,status,last_message_at,ads(title)').order('last_message_at',{ascending:false});if(error){$('threads').textContent='دریافت گفت‌وگوها انجام نشد: '+error.message;return}if(!data?.length){$('threads').innerHTML='<div class="empty">هنوز گفت‌وگویی ندارید.</div>';return}$('threads').innerHTML=data.map(c=>'<div class="item '+(active===c.id?'active':'')+'" onclick="openThread(\''+c.id+'\')"><b>'+esc(c.ads?.title||'آگهی')+'</b><div class="muted">'+(c.buyer_id===me.id?'گفت‌وگو با فروشنده':'گفت‌وگو با خریدار')+' · '+new Date(c.last_message_at).toLocaleString('fa-IR')+'</div></div>').join('')}
async function openThread(id){const {data:c,error}=await db.from('ad_conversations').select('id,ad_id,buyer_id,seller_id,status,ads(title)').eq('id',id).single();if(error||!c){note('گفت‌وگو پیدا نشد یا دسترسی ندارید.');return}if(c.status!=='open'){$('sendForm').style.display='none'}else $('sendForm').style.display='flex';active=id;$('chatTitle').innerHTML='<b>'+esc(c.ads?.title||'گفت‌وگو')+'</b><div class="muted">پیام‌ها فقط برای خریدار و فروشنده قابل مشاهده‌اند.</div>';await loadMessages();await loadThreads();if(channel)await db.removeChannel(channel);channel=db.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'ad_messages',filter:'conversation_id=eq.'+id},payload=>{if(payload.new.sender_id!==me.id)loadMessages()}).subscribe()}
async function loadMessages(){const {data,error}=await db.from('ad_messages').select('id,sender_id,body,created_at').eq('conversation_id',active).order('created_at',{ascending:true});if(error){$('chat').innerHTML='<div class="empty">خطا در دریافت پیام‌ها: '+esc(error.message)+'</div>';return}$('chat').innerHTML=data?.length?data.map(m=>'<div class="bubble '+(m.sender_id===me.id?'mine':'')+'">'+esc(m.body)+'<div class="muted">'+new Date(m.created_at).toLocaleString('fa-IR')+'</div></div>').join(''):'<div class="empty">اولین پیام را شما بفرستید.</div>';$('chat').scrollTop=$('chat').scrollHeight}
$('sendForm').addEventListener('submit',async e=>{e.preventDefault();if(!active||!me)return;const body=$('body').value.trim();if(!body)return;const btn=e.submitter;btn.disabled=true;const {error}=await db.from('ad_messages').insert({conversation_id:active,sender_id:me.id,body});btn.disabled=false;if(error){alert('ارسال پیام انجام نشد: '+error.message);return}$('body').value='';await loadMessages();await loadThreads()});
db.auth.onAuthStateChange(()=>{if(!me)init()});init();
</script></body></html>
